name: "Dynamic Sky"
author: "ov-studio"
author_url: "https://github.com/ov-studio"
version: "1.0.0"

tagline: "Dynamic volumetric sky, weather and day/night cycle"
featured: true

tags:
  - "gfx"
  - "vfx"

description: |
  Dynamic Sky ft. a living day/night cycle with a glowing sun, a moon with real phases, twinkling stars, volumetric clouds and cinematic god rays, all synced from the server to every player.

  Fourteen weather presets from drizzle to blizzard. Rain and snow fall for real and never indoors, every drop splashes and ripples where it lands, puddles form on wet ground, and snow piles up on every surface, then melts away.

  **Credits:**
  • Moon texture: NASA CGI Moon Kit - https://svs.gsfc.nasa.gov/4720/
  • Clouds: A. Schneider, "Horizon: Zero Dawn" (2015)
  • Sun color: F. Kasten, A. T. Young (1989)
  • Cloud scattering: L. G. Henyey, J. L. Greenstein (1941)

  **Exports (server):**
  • `util.export.call("dynamic_sky", "set_time", hour)` - sets the hour (0-24)
  • `util.export.call("dynamic_sky", "set_weather", name)` - sets the weather
  • `util.export.call("dynamic_sky", "set_timescale", scale)` - 1 = normal, 0 = freeze
  • `util.export.call("dynamic_sky", "get_time")` - returns the current hour

  **Exports (client):**
  • `util.export.call("dynamic_sky", "set_rain", value)` - rain intensity 0-1, nil = auto
  • `util.export.call("dynamic_sky", "set_snow", value)` - snow intensity 0-1, nil = auto
  • `util.export.call("dynamic_sky", "set_fog", value)` - fog intensity 0-1, nil = auto
  • `util.export.call("dynamic_sky", "set_lightning", value)` - lightning intensity 0-1, nil = auto
  • `util.export.call("dynamic_sky", "set_wind", value)` - wind multiplier 0-6, nil = auto
  • `util.export.call("dynamic_sky", "set_wind_dir", deg)` - direction the wind blows towards
  • `util.export.call("dynamic_sky", "set_snow_cover", value)` - snow on surfaces 0-1, nil = auto
  • `util.export.call("dynamic_sky", "set_sun_size", deg)` - apparent sun radius
  • `util.export.call("dynamic_sky", "set_moon_size", deg)` - apparent moon radius
  • `util.export.call("dynamic_sky", "set_moon_phase", phase)` - phase name or 0-1, nil = auto
  • `util.export.call("dynamic_sky", "get_moon_phase")` - returns phase (0-1) and its name
  • `util.export.call("dynamic_sky", "get_time")` - returns the local hour
  • `util.export.call("dynamic_sky", "get_weather")` - returns the weather name
  • `util.export.call("dynamic_sky", "flash", strength)` - triggers a lightning flash
  • `util.export.call("dynamic_sky", "toggle")` - switches the sky on/off

  **Commands:**
  • `/time <hour | HH:MM>` - sets the time of day
  • `/weather <name>` - sets the weather
  • `/timescale <n>` - 1 = normal, 0 = freeze
  • `/sky_rain <0-1 | auto>` - rain intensity
  • `/sky_snow <0-1 | auto>` - snow intensity
  • `/sky_fog <0-1 | auto>` - fog intensity
  • `/sky_lightning <0-1 | auto>` - lightning intensity
  • `/sky_wind <0-6 | auto>` - wind strength
  • `/sky_winddir <deg>` - wind direction
  • `/snow_cover <0-1 | auto>` - snow on surfaces
  • `/sky_quality <low|medium|high|ultra>` - cloud quality
  • `/sky_clouds [on|off]` - toggles the clouds
  • `/sky_precip [on|off]` - toggles rain and snow particles
  • `/sky_splash [on|off]` - toggles rain splashes
  • `/sky_glow [on|off]` - toggles the sun bloom
  • `/sky_godrays [on|off]` - toggles the god rays
  • `/sky_toggle` - switches the sky on/off
  • `/sun_size <deg>` - apparent sun radius
  • `/moon_size <deg>` - apparent moon radius
  • `/moon_phase <name | 0-1 | auto>` - sets the moon phase

scripts:
  - { src: "config.lua", type: "shared" }
  - { src: "server.lua", type: "server" }
  - { src: "client.lua", type: "client" }

files:
  - "shaders/**"
  - "textures/**"
