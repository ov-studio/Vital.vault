description: |
  Lut is a curated pack of 63 color grading presets, organized into
  five collections: Cinematic, Moody, Portrait, ColorBoost, and
  Lutify — covering everything from film-inspired tones to punchy
  color boosts and natural skin-tone shaping.

  Apply, swap, or reset LUTs on the fly through simple exported APIs,
  making it easy to wire up your own menu or let other resources control grading directly.

  **Exports:**
  • `util.export.call("lut_presets", "get_list")` — Returns the full ordered list of available preset paths.
  • `util.export.call("lut_presets", "get_lut")` — Returns the 1-based index of the currently active preset, or `false` if none is applied.
  • `util.export.call("lut_presets", "set_lut", index)` — Applies the preset at the given index. Returns `false` if the index is out of range.
  • `util.export.call("lut_presets", "reset_lut")` — Clears the active LUT, restoring the default ungraded color output.

  **Commands:**
  • `/lut <index>` — Applies the preset at the given index directly from the console.

